<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WangSeng87 - Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: rgba(114,35,126,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #ffd700;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #72237e;
            box-shadow: 0 0 20px rgba(114,35,126,0.5);
        }

        .logo-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-form {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 500;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255,255,255,0.15);
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #72237e;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn:hover {
            background: #8b2e98;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(114,35,126,0.4);
        }

        .btn-google {
            background: #4285f4;
            color: white;
        }

        .btn-google:hover {
            background: #357ae8;
            box-shadow: 0 10px 20px rgba(66,133,244,0.4);
        }

        .btn-primary {
            background: #ffd700;
            color: #72237e;
        }

        .btn-primary:hover {
            background: #ffed4e;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255,255,255,0.2);
        }

        .divider span {
            background: rgba(26,26,46,0.9);
            padding: 0 15px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            position: relative;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .alert-success {
            background: rgba(76,175,80,0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .alert-error {
            background: rgba(244,67,54,0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .alert-info {
            background: rgba(33,150,243,0.2);
            border: 1px solid #2196f3;
            color: #2196f3;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #ffd700;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .user-info {
            display: none;
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-top: 20px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 10px;
        }

        .user-name {
            color: #ffd700;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .user-email {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .admin-badge {
            background: #ffd700;
            color: #72237e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }

        .register-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .register-section p {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .demo-info {
            background: rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .demo-info h4 {
            color: #ffd700;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .demo-info p {
            color: rgba(255,255,255,0.7);
            margin-bottom: 5px;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-container">
                <video src="wangseng-lion.mp4" autoplay loop muted playsinline class="logo-video"></video>
            </div>
            <h1>Admin Portal</h1>
            <p>WangSeng87 Management System</p>
        </div>

        <div id="alertContainer"></div>

        <!-- Demo Info -->
        <div class="demo-info">
            <h4><i class="material-icons" style="font-size: 16px; vertical-align: middle;">info</i> Demo Information</h4>
            <p><strong>Admin Code:</strong> WANG87</p>
            <p><strong>Default Admin:</strong> admin@wangseng87.com / admin123</p>
            <p><strong>Register:</strong> Use admin code to create new admin</p>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
            <div class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@wangseng87.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                
                <button class="btn" onclick="loginWithEmail()">
                    <i class="material-icons">login</i>
                    Sign In
                </button>
            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="btn btn-google" onclick="loginWithGoogle()">
                <i class="material-icons">mail</i>
                Sign in with Google
            </button>

            <div class="register-section">
                <p>Don't have an admin account?</p>
                <button class="btn btn-primary" onclick="goToRegister()">
                    <i class="material-icons">person_add</i>
                    Register Admin Account
                </button>
            </div>
        </div>

        <!-- User Info (shown when logged in) -->
        <div id="userInfo" class="user-info">
            <img id="userAvatar" class="user-avatar" src="" alt="User Avatar">
            <div class="admin-badge">Administrator</div>
            <div class="user-name" id="userName"></div>
            <div class="user-email" id="userEmail"></div>
            <button class="btn" onclick="goToAdmin()">
                <i class="material-icons">dashboard</i>
                Go to Admin Dashboard
            </button>
            <button class="btn" onclick="logout()">
                <i class="material-icons">logout</i>
                Sign Out
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: rgba(255,255,255,0.7);">Signing in...</p>
        </div>
    </div>

    <script>
        // Current logged in admin
        let currentAdmin = null;

        // Check if admin is already logged in
        function checkExistingLogin() {
            const savedAdmin = localStorage.getItem('wangseng87_current_admin');
            if (savedAdmin) {
                currentAdmin = JSON.parse(savedAdmin);
                showUserInfo(currentAdmin);
            }
        }

        // Show alert message
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <i class="material-icons">${type === 'success' ? 'check_circle' : type === 'error' ? 'error' : 'info'}</i>
                ${message}
            `;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Show loading
        function showLoading(show = true) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('loginForm').style.display = show ? 'none' : 'block';
        }

        // Login with email and password
        function loginWithEmail() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            showLoading(true);

            // Get admins from localStorage
            const admins = JSON.parse(localStorage.getItem('wangseng87_admins') || '[]');
            
            // Check for default admin first
            if (email === 'admin@wangseng87.com' && password === 'admin123') {
                const defaultAdmin = {
                    id: 0,
                    fullName: 'Default Admin',
                    email: 'admin@wangseng87.com',
                    role: 'admin',
                    authMethod: 'email'
                };
                currentAdmin = defaultAdmin;
                localStorage.setItem('wangseng87_current_admin', JSON.stringify(currentAdmin));
                showLoading(false);
                showAlert('Login successful!', 'success');
                showUserInfo(currentAdmin);
                return;
            }

            // Check registered admins
            const admin = admins.find(a => a.email === email);
            
            setTimeout(() => {
                if (admin) {
                    // Check password (basic decoding for demo)
                    if (admin.authMethod === 'google') {
                        // Google auth user
                        currentAdmin = admin;
                        localStorage.setItem('wangseng87_current_admin', JSON.stringify(currentAdmin));
                        showLoading(false);
                        showAlert('Google login successful!', 'success');
                        showUserInfo(currentAdmin);
                    } else if (atob(admin.password) === password) {
                        // Email/password user
                        currentAdmin = admin;
                        localStorage.setItem('wangseng87_current_admin', JSON.stringify(currentAdmin));
                        showLoading(false);
                        showAlert('Login successful!', 'success');
                        showUserInfo(currentAdmin);
                    } else {
                        showLoading(false);
                        showAlert('Invalid password', 'error');
                    }
                } else {
                    showLoading(false);
                    showAlert('Admin not found. Please register first.', 'error');
                }
            }, 1500);
        }

        // Login with Google (simulated)
        function loginWithGoogle() {
            showLoading(true);

            // Get admins from localStorage
            const admins = JSON.parse(localStorage.getItem('wangseng87_admins') || '[]');
            
            setTimeout(() => {
                // Look for Google auth user
                const googleAdmin = admins.find(a => a.authMethod === 'google');
                
                if (googleAdmin) {
                    currentAdmin = googleAdmin;
                    localStorage.setItem('wangseng87_current_admin', JSON.stringify(currentAdmin));
                    showLoading(false);
                    showAlert('Google login successful!', 'success');
                    showUserInfo(currentAdmin);
                } else {
                    showLoading(false);
                    showAlert('No Google admin found. Please register with Google first.', 'error');
                }
            }, 1500);
        }

        // Show user info when logged in
        function showUserInfo(admin) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            
            document.getElementById('userAvatar').src = admin.photoURL || 'https://via.placeholder.com/60x60/72237e/ffffff?text=ADMIN';
            document.getElementById('userName').textContent = admin.fullName || 'Admin User';
            document.getElementById('userEmail').textContent = admin.email;
        }

        // Go to admin dashboard
        function goToAdmin() {
            window.location.href = 'admin.html';
        }

        // Logout
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('wangseng87_current_admin');
                currentAdmin = null;
                showAlert('Logged out successfully', 'success');
                
                // Reset form
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('userInfo').style.display = 'none';
            }
        }

        // Go to registration
        function goToRegister() {
            window.location.href = 'admin-register.html';
        }

        // Auto-play logo video
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.querySelector('.logo-video');
            if (video) {
                video.play().catch(e => console.log('Video autoplay failed:', e));
            }
            
            // Check for existing login
            checkExistingLogin();
        });
    </script>
</body>
</html>
