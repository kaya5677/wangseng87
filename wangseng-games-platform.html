<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WangSeng87 Premium Gaming</title>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:linear-gradient(#0f1529,#0a0a1a);
color:white;
overflow-x:hidden;
}

/* container */

.container{
width:min(100% - 24px,1500px);
margin:auto;
padding:10px;
}

/* navbar */

.navbar{
background:#000;
border-radius:12px;
padding:10px;
margin-bottom:20px;
}

.nav-content{
display:flex;
justify-content:space-around;
flex-wrap:wrap;
}

.nav-item{
cursor:pointer;
padding:8px 12px;
border-radius:8px;
}

.nav-item:hover{
background:#222;
color:#ffd700;
}

/* header */

.header{
text-align:center;
margin-bottom:20px;
}

/* section */

.section{
display:none;
}

.section.active{
display:block;
}

/* provider grid */

.provider-wrapper{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:14px;
max-width:1400px;
margin:auto;
}

.provider-wrapper .cursor-pointer{
border-radius:18px;
overflow:hidden;
}

.provider-wrapper img{
width:100%;
aspect-ratio:3/4;
object-fit:cover;
border-radius:18px;
}

.provider-wrapper .cursor-pointer:hover img{
transform:scale(1.05);
transition:.3s;
}

/* responsive */

@media(max-width:1100px){
.provider-wrapper{grid-template-columns:repeat(4,1fr);}
}

@media(max-width:768px){
.provider-wrapper{grid-template-columns:repeat(3,1fr);}
}

@media(max-width:480px){
.provider-wrapper{grid-template-columns:repeat(2,1fr);}
}

/* taskbar */

.taskbar{
position:fixed;
bottom:0;
left:0;
right:0;
background:#000;
border-top:1px solid #444;
}

.taskbar-content{
display:grid;
grid-template-columns:repeat(6,1fr);
max-width:900px;
margin:auto;
}

.taskbar-item{
display:flex;
flex-direction:column;
align-items:center;
padding:10px;
cursor:pointer;
font-size:12px;
}

.taskbar-item:hover{
color:#ffd700;
}

.taskbar-icon{
font-size:20px;
}

body{
padding-bottom:80px;
}

</style>
</head>
