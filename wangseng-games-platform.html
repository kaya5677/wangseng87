            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Premium Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 140, 0, 0.04) 0%, transparent 60%);
            animation: backgroundGlow 12s ease-in-out infinite;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 50% 30%, rgba(255, 215, 0, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 20% 70%, rgba(255, 215, 0, 0.08) 0%, transparent 40%);
            animation: shimmerEffect 18s ease-in-out infinite;
            z-index: -1;
        }

        /* Floating Gold Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.8), rgba(255, 237, 78, 0.4));
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 20s infinite linear;
        }

        .particle:nth-child(1) { left: 8%; animation-delay: 0s; animation-duration: 16s; }
        .particle:nth-child(2) { left: 23%; animation-delay: 3s; animation-duration: 19s; }
        .particle:nth-child(3) { left: 38%; animation-delay: 6s; animation-duration: 17s; }
        .particle:nth-child(4) { left: 53%; animation-delay: 9s; animation-duration: 20s; }
        .particle:nth-child(5) { left: 68%; animation-delay: 12s; animation-duration: 18s; }
        .particle:nth-child(6) { left: 83%; animation-delay: 15s; animation-duration: 21s; }
        .particle:nth-child(7) { left: 12%; animation-delay: 2s; animation-duration: 15s; }
        .particle:nth-child(8) { left: 27%; animation-delay: 5s; animation-duration: 22s; }
        .particle:nth-child(9) { left: 42%; animation-delay: 8s; animation-duration: 16s; }
        .particle:nth-child(10) { left: 57%; animation-delay: 11s; animation-duration: 19s; }
        .particle:nth-child(11) { left: 72%; animation-delay: 14s; animation-duration: 17s; }
        .particle:nth-child(12) { left: 87%; animation-delay: 17s; animation-duration: 20s; }

        /* Premium Header */
        .header {

            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            padding: 20px 0;
            position: relative;
            z-index: 100;
        }

        .header-content {

            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {

            align-items: center;
            gap: 15px;
        }

        .main-logo {

            height: 200px;

                inset 0 0 20px rgba(255, 215, 0, 0.2);
            background: #000;
        }

        .main-logo::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, rgba(255, 140, 0, 0.08) 25%, transparent 60%);

            z-index: -1;

        .main-logo video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .platform-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

        }

        .auth-buttons {

        .btn {

            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-primary:hover {

        }

        .btn-secondary {
            background: transparent;
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffd700;
        }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px 100px;
            position: relative;
            z-index: 10;
        }

        /* Section Header */
        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 36px;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .title-decoration {
            width: 200px;
            height: 3px;
            margin: 0 auto;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            border-radius: 2px;
            animation: decorationPulse 2s ease-in-out infinite;
        }

        /* Premium Provider Container */
        .provider-container {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 215, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .provider-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), transparent);
        }

        /* Provider Grid */
        .provider-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            width: 100%;
        }

        /* Provider Card */
        .provider-card {
            position: relative;
            background: linear-gradient(180deg, rgba(20, 20, 40, 0.8), rgba(10, 10, 20, 0.9));
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 3/4;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .provider-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                120deg,
                transparent 0%,
                rgba(255, 255, 255, 0.05) 35%,
                rgba(255, 215, 0, 0.1) 50%,
                rgba(255, 255, 255, 0.05) 65%,
                transparent 100%
            );
            transform: translateX(-120%);
            transition: transform 0.6s ease;
            z-index: 2;
        }

        .provider-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 
                0 12px 30px rgba(0, 0, 0, 0.4),
                0 0 25px rgba(255, 215, 0, 0.2);
        }

        .provider-card:hover::before {
            transform: translateX(120%);
        }

        .provider-card:hover .provider-image {
            transform: scale(1.05);
            filter: saturate(1.1) contrast(1.05);
        }

        .provider-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            transition: transform 0.3s ease, filter 0.3s ease;
            border-radius: 18px;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .provider-grid {

        @media (max-width: 900px) {

                gap: 12px;

                gap: 10px;
            }
            
            .main-container {
                padding: 30px 15px 100px;
            }

            .platform-title {
                font-size: 20px;
            }
            
            .section-title {
                font-size: 24px;

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;

        .nav-item {

            border-radius: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            min-height: 60px;
        }

        .nav-item:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;

        }

        .nav-item.active {

            background: rgba(255, 215, 0, 0.15);

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
            display: block;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Animations */
        @keyframes backgroundGlow {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        @keyframes shimmerEffect {
            0%, 100% { opacity: 0.5; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.8; transform: scale(1.1) rotate(1deg); }
        }

        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(100vh) translateX(0) scale(0); }
            5% { opacity: 0.8; transform: translateY(95vh) translateX(5px) scale(1); }
            25% { opacity: 1; transform: translateY(75vh) translateX(-3px) scale(1); }
            50% { opacity: 1; transform: translateY(50vh) translateX(8px) scale(1); }
            75% { opacity: 1; transform: translateY(25vh) translateX(-5px) scale(1); }
            95% { opacity: 0.8; transform: translateY(5vh) translateX(3px) scale(1); }
            100% { opacity: 0; transform: translateY(0vh) translateX(0) scale(0); }
        }

        @keyframes decorationPulse {
            0%, 100% { width: 200px; opacity: 0.6; }
            50% { width: 260px; opacity: 1; }
        }

        @keyframes logoRadialGlow {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
                filter: brightness(1);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 0.8;
                filter: brightness(1.2);
            }
        }
    </style>
</head>

        function setActiveNav(element) {

        // Notification system
        function showNotification(title, message) {
            // Create notification element
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(10, 10, 20, 0.95));
                border: 1px solid rgba(255, 215, 0, 0.3);
                border-radius: 16px;
                padding: 24px 32px;
                color: white;
                z-index: 10000;
                backdrop-filter: blur(20px);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
                text-align: center;
                min-width: 300px;
                animation: notificationSlide 0.3s ease-out;
            `;
            
            notification.innerHTML = `
                <div style="font-size: 24px; margin-bottom: 8px;">${title}</div>
                <div style="font-size: 14px; color: rgba(255, 255, 255, 0.8);">${message}</div>
            `;
            
            // Add animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes notificationSlide {
                    from {
                        opacity: 0;
                        transform: translate(-50%, -50%) scale(0.9);
                    }
                    to {
                        opacity: 1;
                        transform: translate(-50%, -50%) scale(1);
                    }
                }
            `;
            document.head.appendChild(style);
            
            document.body.appendChild(notification);
            
            // Auto remove after 2 seconds
            setTimeout(() => {
                notification.style.animation = 'notificationSlide 0.3s ease-out reverse';
                setTimeout(() => {
                    document.body.removeChild(notification);
                    document.head.removeChild(style);
                }, 300);
            }, 2000);
        }
